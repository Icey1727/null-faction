name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: ./nullfaction-mod
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./nullfaction-mod
        run: ./gradlew build

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: nullfaction-mod-jar
          path: |
            nullfaction-mod/build/libs/*.jar
            !nullfaction-mod/build/libs/*-sources.jar
